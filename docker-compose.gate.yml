# A local passkey-gate for the board: plain http on localhost, no Traefik.
# Build context is the sibling checkout of passkey-gate. Port 47110 on the host
# so it never collides with a project you are running on 8000.
#
#   docker compose -f docker-compose.gate.yml up -d --build
#   docker compose -f docker-compose.gate.yml logs gate    # first enrollment link
#   docker compose -f docker-compose.gate.yml exec gate python -m gate enroll-link
#
# The public gate (opt-in; README "Using it from other devices"): the board's sign-in on this
# machine's tailnet name, https through `tailscale serve --https=8443`, with passkeys, sessions and
# tokens of its own. It starts only with the tailnet profile, and TAILNET_HOST set to that name (in
# .env, which compose reads too, or in the shell):
#
#   docker compose -f docker-compose.gate.yml --profile tailnet up -d --build
#   docker compose -f docker-compose.gate.yml logs gate-public    # its first enrollment link
#   docker compose -f docker-compose.gate.yml exec gate-public python -m gate enroll-link
#
# Both publish on 127.0.0.1 only: nothing here is reachable off this machine but through tailscale serve.
services:
  gate:
    build: ../passkey-gate
    restart: unless-stopped
    ports:
      - '127.0.0.1:47110:8000'
    volumes:
      - gate_data:/data
    environment:
      - GATE_INSECURE=1
      - GATE_DOMAIN=localhost
      - GATE_HOST=localhost:47110
      - GATE_USER=${GATE_USER:-me}
      - GATE_SESSION_DAYS=${GATE_SESSION_DAYS:-90}
      - TZ=${TZ:-America/Tegucigalpa}

  gate-public:
    build: ../passkey-gate
    profiles: ['tailnet']
    restart: unless-stopped
    ports:
      - '127.0.0.1:47111:8000'
    volumes:
      - gate_public_data:/data
    environment:
      # https (no GATE_INSECURE): the passkeys are for the tailnet name, the browser reaches it on 8443.
      # Without TAILNET_HOST the name is one that never resolves, so nothing works by accident.
      - GATE_DOMAIN=${TAILNET_HOST:-tailnet-host-not-set.invalid}
      - GATE_HOST=${TAILNET_HOST:-tailnet-host-not-set.invalid}:8443
      - GATE_USER=${GATE_USER:-me}
      - GATE_SESSION_DAYS=${GATE_SESSION_DAYS:-90}
      - TZ=${TZ:-America/Tegucigalpa}

volumes:
  gate_data:
  gate_public_data:
