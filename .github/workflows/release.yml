# Builds the desktop app on Windows and Linux and publishes both to the GitHub Release of the tag
# (docs/releasing.md). Push a tag v<version>, the version of desktop/app/package.json, or run it by hand
# (workflow_dispatch) on a commit whose version has no release yet. Each build job runs
# `pnpm release --stage-only` (scripts/release.mjs): pnpm desktop:package, then every file copied to
# desktop/dist/release under its versioned name and its stable one, the one
# https://github.com/nervesscat/agent-board/releases/latest/download/<name> always points to, and
# the update metadata the installed app's updater reads (latest.yml, latest-linux.yml: each versioned
# file with its sha512, checked against the files as they are staged).
# The release is published only when both builds succeed, so it never goes out with a platform missing.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  windows:
    name: Windows installer
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: pnpm

      # The versions the caches below are keyed on, from the lockfile: a bump of either starts a fresh
      # cache instead of restoring a stale one.
      - name: Read the cached download versions
        id: versions
        shell: bash
        run: |
          version() {
            found=$(grep -E "^  $1@[0-9]" pnpm-lock.yaml | head -n 1 | sed -E "s/^  $1@//; s/[(:].*$//" || true)
            if [ -z "$found" ]; then
              echo "::error::pnpm-lock.yaml lists no $1: the cache keys read its version from there"
              exit 1
            fi
            printf '%s\n' "$found"
          }
          {
            echo "electron=$(version electron)"
            echo "better-sqlite3=$(version better-sqlite3)"
            echo "electron-builder=$(version electron-builder)"
          } >> "$GITHUB_OUTPUT"

      # The Electron binary is fetched when desktop/package.mjs requires the electron package, and kept
      # here; a warm run of the same version downloads nothing. Another version starts a fresh cache.
      - name: Cache the Electron binary
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.os == 'Windows' && '%LOCALAPPDATA%\electron\Cache' || '~/.cache/electron' }}
          key: electron-${{ runner.os }}-${{ steps.versions.outputs.electron }}

      # electron-builder fetches its own tools (NSIS, winCodeSign here; AppImage, fpm and the like on
      # Linux) from GitHub's releases into this cache; its directories are named by tool version, so an
      # older cache is still worth restoring.
      - name: Cache electron-builder's tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.os == 'Windows' && '%LOCALAPPDATA%\electron-builder\Cache' || '~/.cache/electron-builder' }}
          key: electron-builder-${{ runner.os }}-${{ steps.versions.outputs.electron-builder }}
          restore-keys: electron-builder-${{ runner.os }}-

      # better-sqlite3's install script (prebuild-install) downloads its prebuilt binary from GitHub's
      # releases, and keeps it in the npm cache; restored, a warm run downloads nothing.
      - name: Cache the better-sqlite3 prebuild
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.os == 'Windows' && '%APPDATA%\npm-cache\_prebuilds' || '~/.npm/_prebuilds' }}
          key: prebuild-${{ runner.os }}-better-sqlite3-${{ steps.versions.outputs.better-sqlite3 }}
          restore-keys: prebuild-${{ runner.os }}-better-sqlite3-

      # That download is GitHub's too, and it answers 504 under load: retry the install, but only while
      # the failure reads like the network's, so a real install error is not run four times.
      - name: Install
        shell: bash
        run: |
          log="$RUNNER_TEMP/pnpm-install.log"
          for attempt in 1 2 3 4; do
            if pnpm install --frozen-lockfile 2>&1 | tee "$log"; then exit 0; fi
            if ! grep -Eqi 'ETIMEDOUT|ECONNRESET|ECONNREFUSED|EAI_AGAIN|ENOTFOUND|socket hang up|getaddrinfo|Gateway Time|status code (429|5[0-9][0-9])|net::ERR_' "$log"; then
              echo "::error::pnpm install failed (attempt $attempt of 4) for a reason other than a download; see above."
              exit 1
            fi
            if [ "$attempt" -lt 4 ]; then
              echo "::warning::pnpm install failed (attempt $attempt of 4) on a download; retrying in $((attempt * 30))s."
              sleep $((attempt * 30))
            fi
          done
          echo "::error::pnpm install failed 4 times: better-sqlite3's prebuilt binary (its GitHub release) could not be downloaded."
          exit 1

      # A cold cache downloads the Electron binary, better-sqlite3's Electron prebuild and the packaging
      # tools here: each is a GitHub release, so each can answer 504. Retried with backoff while the
      # failure reads like the network's; the step rebuilds from scratch, so a retry is safe.
      - name: Build the installer (pnpm desktop:package) and stage it
        shell: bash
        run: |
          log="$RUNNER_TEMP/release-stage.log"
          for attempt in 1 2 3 4; do
            if pnpm release --stage-only 2>&1 | tee "$log"; then exit 0; fi
            if ! grep -Eqi 'ETIMEDOUT|ECONNRESET|ECONNREFUSED|EAI_AGAIN|ENOTFOUND|socket hang up|getaddrinfo|Gateway Time|status code (429|5[0-9][0-9])|net::ERR_' "$log"; then
              echo "::error::pnpm release --stage-only failed (attempt $attempt of 4) for a reason other than a download; see above."
              exit 1
            fi
            if [ "$attempt" -lt 4 ]; then
              echo "::warning::pnpm release --stage-only failed (attempt $attempt of 4) on a download; retrying in $((attempt * 30))s."
              sleep $((attempt * 30))
            fi
          done
          echo "::error::pnpm release --stage-only failed 4 times: the Electron binary (electron-v${{ steps.versions.outputs.electron }}-win32-x64.zip), better-sqlite3's Electron prebuild or electron-builder's tools could not be downloaded."
          exit 1

      - name: Smoke-test the unpacked app
        run: pnpm desktop:smoke --port 8240

      - name: Check the stable name and the update metadata
        shell: bash
        run: |
          test -f desktop/dist/release/agent-board-setup-x64.exe
          test -f desktop/dist/release/latest.yml
          cat desktop/dist/release/latest.yml

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-windows
          path: desktop/dist/release/
          if-no-files-found: error
          retention-days: 7

  # The same packaging and smoke test as CI's desktop-linux job (.github/workflows/ci.yml).
  linux:
    name: Linux packages (AppImage, deb, rpm, pacman)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: pnpm

      # Ubuntu 24.04's AppArmor keeps unprivileged programs from making user namespaces, which
      # Chromium's sandbox needs; the app keeps its sandbox, the runner allows them instead.
      - name: Allow user namespaces for Chromium's sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      # rpmbuild for the .rpm, bsdtar for the pacman package, Xvfb for the window, and what Electron
      # needs to run here (its check of the packed driver, the smoke test).
      - name: Install the packaging tools
        run: >-
          sudo apt-get update && sudo apt-get install -y rpm libarchive-tools xvfb xauth
          libgtk-3-0t64 libnss3 libgbm1 libasound2t64 libxss1 libxtst6 libnotify4 libsecret-1-0

      # The versions the caches below are keyed on, from the lockfile: a bump of either starts a fresh
      # cache instead of restoring a stale one.
      - name: Read the cached download versions
        id: versions
        shell: bash
        run: |
          version() {
            found=$(grep -E "^  $1@[0-9]" pnpm-lock.yaml | head -n 1 | sed -E "s/^  $1@//; s/[(:].*$//" || true)
            if [ -z "$found" ]; then
              echo "::error::pnpm-lock.yaml lists no $1: the cache keys read its version from there"
              exit 1
            fi
            printf '%s\n' "$found"
          }
          {
            echo "electron=$(version electron)"
            echo "better-sqlite3=$(version better-sqlite3)"
            echo "electron-builder=$(version electron-builder)"
          } >> "$GITHUB_OUTPUT"

      # The Electron binary is fetched when desktop/package.mjs requires the electron package, and kept
      # here; a warm run of the same version downloads nothing. Another version starts a fresh cache.
      - name: Cache the Electron binary
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/electron
          key: electron-${{ runner.os }}-${{ steps.versions.outputs.electron }}

      # electron-builder fetches its own tools (AppImage, fpm, rpm and the like) from GitHub's releases
      # into this cache; its directories are named by tool version, so an older cache is still worth
      # restoring.
      - name: Cache electron-builder's tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/electron-builder
          key: electron-builder-${{ runner.os }}-${{ steps.versions.outputs.electron-builder }}
          restore-keys: electron-builder-${{ runner.os }}-

      # better-sqlite3's install script (prebuild-install) downloads its prebuilt binary from GitHub's
      # releases, and keeps it in the npm cache; restored, a warm run downloads nothing.
      - name: Cache the better-sqlite3 prebuild
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm/_prebuilds
          key: prebuild-${{ runner.os }}-better-sqlite3-${{ steps.versions.outputs.better-sqlite3 }}
          restore-keys: prebuild-${{ runner.os }}-better-sqlite3-

      # That download is GitHub's too, and it answers 504 under load: retry the install, but only while
      # the failure reads like the network's, so a real install error is not run four times.
      - name: Install
        shell: bash
        run: |
          log="$RUNNER_TEMP/pnpm-install.log"
          for attempt in 1 2 3 4; do
            if pnpm install --frozen-lockfile 2>&1 | tee "$log"; then exit 0; fi
            if ! grep -Eqi 'ETIMEDOUT|ECONNRESET|ECONNREFUSED|EAI_AGAIN|ENOTFOUND|socket hang up|getaddrinfo|Gateway Time|status code (429|5[0-9][0-9])|net::ERR_' "$log"; then
              echo "::error::pnpm install failed (attempt $attempt of 4) for a reason other than a download; see above."
              exit 1
            fi
            if [ "$attempt" -lt 4 ]; then
              echo "::warning::pnpm install failed (attempt $attempt of 4) on a download; retrying in $((attempt * 30))s."
              sleep $((attempt * 30))
            fi
          done
          echo "::error::pnpm install failed 4 times: better-sqlite3's prebuilt binary (its GitHub release) could not be downloaded."
          exit 1

      # A cold cache downloads the Electron binary, better-sqlite3's Electron prebuild and the packaging
      # tools here: each is a GitHub release, so each can answer 504. Retried with backoff while the
      # failure reads like the network's; the step rebuilds from scratch, so a retry is safe.
      - name: Build the Linux packages (pnpm desktop:package) and stage them
        shell: bash
        run: |
          log="$RUNNER_TEMP/release-stage.log"
          for attempt in 1 2 3 4; do
            if pnpm release --stage-only 2>&1 | tee "$log"; then exit 0; fi
            if ! grep -Eqi 'ETIMEDOUT|ECONNRESET|ECONNREFUSED|EAI_AGAIN|ENOTFOUND|socket hang up|getaddrinfo|Gateway Time|status code (429|5[0-9][0-9])|net::ERR_' "$log"; then
              echo "::error::pnpm release --stage-only failed (attempt $attempt of 4) for a reason other than a download; see above."
              exit 1
            fi
            if [ "$attempt" -lt 4 ]; then
              echo "::warning::pnpm release --stage-only failed (attempt $attempt of 4) on a download; retrying in $((attempt * 30))s."
              sleep $((attempt * 30))
            fi
          done
          echo "::error::pnpm release --stage-only failed 4 times: the Electron binary (electron-v${{ steps.versions.outputs.electron }}-linux-x64.zip), better-sqlite3's Electron prebuild or electron-builder's tools could not be downloaded."
          exit 1

      - name: Smoke-test the unpacked app
        run: xvfb-run -a pnpm desktop:smoke --port 9250

      - name: Check the stable names and the update metadata
        run: |
          test -f desktop/dist/release/agent-board-x86_64.AppImage
          test -f desktop/dist/release/agent-board_amd64.deb
          test -f desktop/dist/release/agent-board.x86_64.rpm
          test -f desktop/dist/release/agent-board.pacman
          test -f desktop/dist/release/latest-linux.yml
          cat desktop/dist/release/latest-linux.yml
          ls -l desktop/dist/release

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-linux
          path: desktop/dist/release/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish the GitHub Release
    needs: [windows, linux]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: The tag
        id: tag
        shell: bash
        run: |
          version=$(node -p "require('./desktop/app/package.json').version")
          tag="v$version"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "$tag" ]; then
            echo "::error::tag $GITHUB_REF_NAME is not v<version of desktop/app/package.json> ($tag)"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: release
          merge-multiple: true

      - name: Create the release or add to it
        shell: bash
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          ls -l release
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" release/* --clobber
          else
            # 0.2.0-beta.1 and the like: a pre-release, so releases/latest stays on the newest stable one.
            prerelease=()
            if [[ "$VERSION" == *-* ]]; then prerelease=(--prerelease); fi
            gh release create "$TAG" release/* --target "$GITHUB_SHA" --title "CrossBoard $VERSION" --generate-notes "${prerelease[@]}"
          fi
          {
            echo "### Released $TAG"
            for f in agent-board-setup-x64.exe agent-board-x86_64.AppImage agent-board_amd64.deb agent-board.x86_64.rpm agent-board.pacman; do
              if [ -f "release/$f" ]; then
                echo "- https://github.com/$GH_REPO/releases/latest/download/$f"
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"
