name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    # The job runs on GitHub's hosted runner (`ubuntu-latest`): a fresh VM for each run, as a
    # non-root user with passwordless sudo, with nothing installed beyond the image. The steps below
    # install what they need (node and pnpm via actions, dependencies, Playwright's Chromium with its
    # system libraries). Nothing here runs on the owner's own server, so the job runs the same for a
    # pull request from a fork, from a branch and from a push.
    runs-on: ubuntu-latest
    # The e2e suite is the long part of this job: about 8 minutes of install, typecheck, lint,
    # migrations, unit tests and build come first, then the suite's tests (582 at the last count). The
    # 70-minute limit was set on the old self-hosted box, where the e2e step measured 31 minutes with
    # another suite sharing the machine. The suite runs 2 workers here (playwright.config.ts): the
    # hosted runner's own timing is what the runs must show; the limit is kept until a measured run
    # says otherwise. No matrix: one job keeps the install and the build to one copy.
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The pnpm version comes from packageManager in package.json.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: pnpm

      # The versions the caches below are keyed on, from the lockfile: a bump of either starts a fresh
      # cache instead of restoring a stale one.
      - name: Read the cached download versions
        id: versions
        shell: bash
        run: |
          version() {
            found=$(grep -E "^  $1@[0-9]" pnpm-lock.yaml | head -n 1 | sed -E "s/^  $1@//; s/[(:].*$//" || true)
            if [ -z "$found" ]; then
              echo "::error::pnpm-lock.yaml lists no $1: the cache keys read its version from there"
              exit 1
            fi
            printf '%s\n' "$found"
          }
          {
            echo "electron=$(version electron)"
            echo "better-sqlite3=$(version better-sqlite3)"
            echo "electron-builder=$(version electron-builder)"
          } >> "$GITHUB_OUTPUT"

      # better-sqlite3's install script (prebuild-install) downloads its prebuilt binary from GitHub's
      # releases, and keeps it in the npm cache; restored, a warm run downloads nothing.
      - name: Cache the better-sqlite3 prebuild
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.os == 'Windows' && '%APPDATA%\npm-cache\_prebuilds' || '~/.npm/_prebuilds' }}
          key: prebuild-${{ runner.os }}-better-sqlite3-${{ steps.versions.outputs.better-sqlite3 }}
          restore-keys: prebuild-${{ runner.os }}-better-sqlite3-

      # That download is GitHub's too, and it answers 504 under load: retry it, but only while the
      # failure reads like the network's, so a real install error is not run four times.
      - name: Install
        shell: bash
        run: |
          log="$RUNNER_TEMP/pnpm-install.log"
          for attempt in 1 2 3 4; do
            if pnpm install --frozen-lockfile 2>&1 | tee "$log"; then exit 0; fi
            if ! grep -Eqi 'ETIMEDOUT|ECONNRESET|ECONNREFUSED|EAI_AGAIN|ENOTFOUND|socket hang up|getaddrinfo|Gateway Time|status code (429|5[0-9][0-9])|net::ERR_' "$log"; then
              echo "::error::pnpm install failed (attempt $attempt of 4) for a reason other than a download; see above."
              exit 1
            fi
            if [ "$attempt" -lt 4 ]; then
              echo "::warning::pnpm install failed (attempt $attempt of 4) on a download; retrying in $((attempt * 30))s."
              sleep $((attempt * 30))
            fi
          done
          echo "::error::pnpm install failed 4 times: better-sqlite3's prebuilt binary (its GitHub release) could not be downloaded."
          exit 1

      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm check:migrations

      # Vitest starts a worker per core, and the git-backed tests spawn dozens of real git
      # processes each: on a machine with many cores the whole suite can crowd the machine enough
      # that a single one of those tests outlives vitest's 5 second default. What they assert is
      # the git calls made, not how long they take, so the default buys nothing here and the
      # release tests already ask for 30 seconds in code for the same reason.
      - name: Unit tests
        run: pnpm test --testTimeout=30000

      # One build, into the folder the e2e suite starts the board from (it then skips its own build).
      - name: Build
        run: pnpm build
        env:
          BOARD_BUILD_DIR: .output-e2e

      - name: Install Playwright's Chromium
        run: pnpm exec playwright install --with-deps chromium

      # Its own timeout, so a suite that hangs fails this step and the Playwright report still
      # uploads below (`if: failure()`) instead of the job's timeout cancelling it all.
      - name: End-to-end tests
        timeout-minutes: 45
        run: pnpm test:e2e
        env:
          E2E_SKIP_BUILD: '1'

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  # The desktop app (README: "The desktop app"): the Windows installer, a smoke test of the unpacked app and of
  # the app as the installer puts it, and the installer kept as an artifact of the run.
  desktop:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: pnpm

      # The versions the caches below are keyed on, from the lockfile: a bump of either starts a fresh
      # cache instead of restoring a stale one.
      - name: Read the cached download versions
        id: versions
        shell: bash
        run: |
          version() {
            found=$(grep -E "^  $1@[0-9]" pnpm-lock.yaml | head -n 1 | sed -E "s/^  $1@//; s/[(:].*$//" || true)
            if [ -z "$found" ]; then
              echo "::error::pnpm-lock.yaml lists no $1: the cache keys read its version from there"
              exit 1
            fi
            printf '%s\n' "$found"
          }
          {
            echo "electron=$(version electron)"
            echo "better-sqlite3=$(version better-sqlite3)"
            echo "electron-builder=$(version electron-builder)"
          } >> "$GITHUB_OUTPUT"

      # The Electron binary is fetched when desktop/package.mjs requires the electron package, and kept
      # here; a warm run of the same version downloads nothing. Another version starts a fresh cache.
      - name: Cache the Electron binary
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.os == 'Windows' && '%LOCALAPPDATA%\electron\Cache' || '~/.cache/electron' }}
          key: electron-${{ runner.os }}-${{ steps.versions.outputs.electron }}

      # electron-builder fetches its own tools (NSIS, winCodeSign here; AppImage, fpm and the like on
      # Linux) from GitHub's releases into this cache; its directories are named by tool version, so an
      # older cache is still worth restoring.
      - name: Cache electron-builder's tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.os == 'Windows' && '%LOCALAPPDATA%\electron-builder\Cache' || '~/.cache/electron-builder' }}
          key: electron-builder-${{ runner.os }}-${{ steps.versions.outputs.electron-builder }}
          restore-keys: electron-builder-${{ runner.os }}-

      # better-sqlite3's install script (prebuild-install) downloads its prebuilt binary from GitHub's
      # releases, and keeps it in the npm cache; restored, a warm run downloads nothing.
      - name: Cache the better-sqlite3 prebuild
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.os == 'Windows' && '%APPDATA%\npm-cache\_prebuilds' || '~/.npm/_prebuilds' }}
          key: prebuild-${{ runner.os }}-better-sqlite3-${{ steps.versions.outputs.better-sqlite3 }}
          restore-keys: prebuild-${{ runner.os }}-better-sqlite3-

      # That download is GitHub's too, and it answers 504 under load: retry the install, but only while
      # the failure reads like the network's, so a real install error is not run four times.
      - name: Install
        shell: bash
        run: |
          log="$RUNNER_TEMP/pnpm-install.log"
          for attempt in 1 2 3 4; do
            if pnpm install --frozen-lockfile 2>&1 | tee "$log"; then exit 0; fi
            if ! grep -Eqi 'ETIMEDOUT|ECONNRESET|ECONNREFUSED|EAI_AGAIN|ENOTFOUND|socket hang up|getaddrinfo|Gateway Time|status code (429|5[0-9][0-9])|net::ERR_' "$log"; then
              echo "::error::pnpm install failed (attempt $attempt of 4) for a reason other than a download; see above."
              exit 1
            fi
            if [ "$attempt" -lt 4 ]; then
              echo "::warning::pnpm install failed (attempt $attempt of 4) on a download; retrying in $((attempt * 30))s."
              sleep $((attempt * 30))
            fi
          done
          echo "::error::pnpm install failed 4 times: better-sqlite3's prebuilt binary (its GitHub release) could not be downloaded."
          exit 1

      # A cold cache downloads the Electron binary, better-sqlite3's Electron prebuild and the packaging
      # tools here: each is a GitHub release, so each can answer 504. Retried with backoff while the
      # failure reads like the network's; the step rebuilds from scratch, so a retry is safe.
      - name: Build the installer
        shell: bash
        run: |
          log="$RUNNER_TEMP/desktop-package.log"
          for attempt in 1 2 3 4; do
            if pnpm desktop:package 2>&1 | tee "$log"; then exit 0; fi
            if ! grep -Eqi 'ETIMEDOUT|ECONNRESET|ECONNREFUSED|EAI_AGAIN|ENOTFOUND|socket hang up|getaddrinfo|Gateway Time|status code (429|5[0-9][0-9])|net::ERR_' "$log"; then
              echo "::error::pnpm desktop:package failed (attempt $attempt of 4) for a reason other than a download; see above."
              exit 1
            fi
            if [ "$attempt" -lt 4 ]; then
              echo "::warning::pnpm desktop:package failed (attempt $attempt of 4) on a download; retrying in $((attempt * 30))s."
              sleep $((attempt * 30))
            fi
          done
          echo "::error::pnpm desktop:package failed 4 times: the Electron binary (electron-v${{ steps.versions.outputs.electron }}-win32-x64.zip), better-sqlite3's Electron prebuild or electron-builder's tools could not be downloaded."
          exit 1

      - name: Smoke-test the unpacked app
        run: pnpm desktop:smoke --port 8240 --screenshot desktop/dist/smoke/window.png --busy-screenshot desktop/dist/smoke/busy-port.png --data-dir-screenshot desktop/dist/smoke/data-dir.png --app-folder-screenshot desktop/dist/smoke/app-folder.png --unwritable-screenshot desktop/dist/smoke/app-folder-unwritable.png

      - name: Install it, smoke-test the installed app, uninstall it
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'agent-board-installed'
          $setup = (Get-Item desktop/dist/agent-board-setup-*.exe).FullName
          Start-Process -Wait -FilePath $setup -ArgumentList '/S', "/D=$dir"
          if (-not (Test-Path "$dir/agent-board.exe")) { throw "the installer put no agent-board.exe in $dir" }
          pnpm desktop:smoke --app $dir --port 8250
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # The uninstaller Windows itself runs: the install's per-user uninstall entry, else one in the folder.
          $entry = Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*' -ErrorAction SilentlyContinue |
            Where-Object { $_.DisplayName -eq 'CrossBoard' } | Select-Object -First 1
          $uninstaller = $null
          $uninstallArgs = @('/S')
          if ($entry -and $entry.UninstallString -match '^"([^"]+)"\s*(.*)$') {
            $uninstaller = $Matches[1]
            if ($Matches[2]) { $uninstallArgs = @($Matches[2] -split '\s+') + '/S' }
          }
          if (-not $uninstaller -or -not (Test-Path $uninstaller)) {
            $uninstaller = (Get-ChildItem $dir -Filter 'Uninstall*.exe' | Select-Object -First 1).FullName
          }
          if (-not $uninstaller) {
            Write-Host "uninstall entry: $($entry | Format-List | Out-String)"
            Get-ChildItem $dir | Format-Table -AutoSize | Out-String -Width 200 | Write-Host
            throw "no uninstaller found for $dir"
          }
          Write-Host "uninstalling with $uninstaller $($uninstallArgs -join ' ')"
          # The uninstaller hands over to a copy of itself and returns at once.
          Start-Process -Wait -FilePath $uninstaller -ArgumentList $uninstallArgs
          for ($i = 0; $i -lt 60 -and (Test-Path "$dir/agent-board.exe"); $i++) { Start-Sleep 1 }
          if (Test-Path "$dir/agent-board.exe") { throw "the uninstaller left $dir/agent-board.exe" }

      - name: Upload the installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: agent-board-setup
          path: desktop/dist/agent-board-setup-*.exe
          if-no-files-found: error
          retention-days: 14

      - name: Upload the smoke test's screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: desktop-smoke
          path: desktop/dist/smoke/
          if-no-files-found: ignore
          retention-days: 14

  # The desktop app's Linux packages (README: "The desktop app"): the AppImage, .deb, .rpm and pacman package,
  # a smoke test of the unpacked app, then each package installed and checked in a container of its
  # distribution (desktop/linux/install-test.sh), and the four kept as artifacts of the run.
  desktop-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: pnpm

      # Ubuntu 24.04's AppArmor keeps unprivileged programs from making user namespaces, which
      # Chromium's sandbox needs; the app keeps its sandbox, the runner allows them instead.
      - name: Allow user namespaces for Chromium's sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      # rpmbuild for the .rpm, bsdtar for the pacman package, Xvfb for the window, and what Electron
      # needs to run here (its check of the packed driver, the smoke test).
      - name: Install the packaging tools
        run: >-
          sudo apt-get update && sudo apt-get install -y rpm libarchive-tools xvfb xauth
          libgtk-3-0t64 libnss3 libgbm1 libasound2t64 libxss1 libxtst6 libnotify4 libsecret-1-0

      # The versions the caches below are keyed on, from the lockfile: a bump of either starts a fresh
      # cache instead of restoring a stale one.
      - name: Read the cached download versions
        id: versions
        shell: bash
        run: |
          version() {
            found=$(grep -E "^  $1@[0-9]" pnpm-lock.yaml | head -n 1 | sed -E "s/^  $1@//; s/[(:].*$//" || true)
            if [ -z "$found" ]; then
              echo "::error::pnpm-lock.yaml lists no $1: the cache keys read its version from there"
              exit 1
            fi
            printf '%s\n' "$found"
          }
          {
            echo "electron=$(version electron)"
            echo "better-sqlite3=$(version better-sqlite3)"
            echo "electron-builder=$(version electron-builder)"
          } >> "$GITHUB_OUTPUT"

      # The Electron binary is fetched when desktop/package.mjs requires the electron package, and kept
      # here; a warm run of the same version downloads nothing. Another version starts a fresh cache.
      - name: Cache the Electron binary
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/electron
          key: electron-${{ runner.os }}-${{ steps.versions.outputs.electron }}

      # electron-builder fetches its own tools (AppImage, fpm, rpm and the like) from GitHub's releases
      # into this cache; its directories are named by tool version, so an older cache is still worth
      # restoring.
      - name: Cache electron-builder's tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/electron-builder
          key: electron-builder-${{ runner.os }}-${{ steps.versions.outputs.electron-builder }}
          restore-keys: electron-builder-${{ runner.os }}-

      # better-sqlite3's install script (prebuild-install) downloads its prebuilt binary from GitHub's
      # releases, and keeps it in the npm cache; restored, a warm run downloads nothing.
      - name: Cache the better-sqlite3 prebuild
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm/_prebuilds
          key: prebuild-${{ runner.os }}-better-sqlite3-${{ steps.versions.outputs.better-sqlite3 }}
          restore-keys: prebuild-${{ runner.os }}-better-sqlite3-

      # That download is GitHub's too, and it answers 504 under load: retry the install, but only while
      # the failure reads like the network's, so a real install error is not run four times.
      - name: Install
        shell: bash
        run: |
          log="$RUNNER_TEMP/pnpm-install.log"
          for attempt in 1 2 3 4; do
            if pnpm install --frozen-lockfile 2>&1 | tee "$log"; then exit 0; fi
            if ! grep -Eqi 'ETIMEDOUT|ECONNRESET|ECONNREFUSED|EAI_AGAIN|ENOTFOUND|socket hang up|getaddrinfo|Gateway Time|status code (429|5[0-9][0-9])|net::ERR_' "$log"; then
              echo "::error::pnpm install failed (attempt $attempt of 4) for a reason other than a download; see above."
              exit 1
            fi
            if [ "$attempt" -lt 4 ]; then
              echo "::warning::pnpm install failed (attempt $attempt of 4) on a download; retrying in $((attempt * 30))s."
              sleep $((attempt * 30))
            fi
          done
          echo "::error::pnpm install failed 4 times: better-sqlite3's prebuilt binary (its GitHub release) could not be downloaded."
          exit 1

      # A cold cache downloads the Electron binary, better-sqlite3's Electron prebuild and the packaging
      # tools here: each is a GitHub release, so each can answer 504. Retried with backoff while the
      # failure reads like the network's; the step rebuilds from scratch, so a retry is safe.
      - name: Build the packages
        shell: bash
        run: |
          log="$RUNNER_TEMP/desktop-package.log"
          for attempt in 1 2 3 4; do
            if pnpm desktop:package 2>&1 | tee "$log"; then exit 0; fi
            if ! grep -Eqi 'ETIMEDOUT|ECONNRESET|ECONNREFUSED|EAI_AGAIN|ENOTFOUND|socket hang up|getaddrinfo|Gateway Time|status code (429|5[0-9][0-9])|net::ERR_' "$log"; then
              echo "::error::pnpm desktop:package failed (attempt $attempt of 4) for a reason other than a download; see above."
              exit 1
            fi
            if [ "$attempt" -lt 4 ]; then
              echo "::warning::pnpm desktop:package failed (attempt $attempt of 4) on a download; retrying in $((attempt * 30))s."
              sleep $((attempt * 30))
            fi
          done
          echo "::error::pnpm desktop:package failed 4 times: the Electron binary (electron-v${{ steps.versions.outputs.electron }}-linux-x64.zip), better-sqlite3's Electron prebuild or electron-builder's tools could not be downloaded."
          exit 1

      - name: Smoke-test the unpacked app
        run: xvfb-run -a pnpm desktop:smoke --port 9250

      # The checkout (with node_modules, for the smoke test) and this node go into each container; the
      # containers run unconfined by seccomp so that Chromium's sandbox can make its namespaces there too.
      - name: Install and check the .deb (Debian)
        run: &install >-
          docker run --rm --shm-size=1g --security-opt seccomp=unconfined
          -v "$GITHUB_WORKSPACE:/repo" -v "$(dirname "$(command -v node)"):/nodebin:ro"
          -e REPO=/repo -e NODE=/nodebin/node "$IMAGE"
          bash -c "bash /repo/desktop/linux/install-test.sh $FORMAT /repo/desktop/dist/$PACKAGE $PORT"
        env:
          IMAGE: debian:bookworm
          FORMAT: deb
          PACKAGE: agent-board_*_amd64.deb
          PORT: 9260

      - name: Install and check the .rpm (Fedora)
        run: *install
        env:
          IMAGE: fedora:latest
          FORMAT: rpm
          PACKAGE: agent-board-*.x86_64.rpm
          PORT: 9270

      - name: Install and check the pacman package (Arch)
        run: *install
        env:
          IMAGE: archlinux:latest
          FORMAT: pacman
          PACKAGE: agent-board-*.pacman
          PORT: 9280

      - name: Check the AppImage (Ubuntu)
        run: *install
        env:
          IMAGE: ubuntu:24.04
          FORMAT: appimage
          PACKAGE: agent-board-*-x86_64.AppImage
          PORT: 9290

      - name: Upload the packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: agent-board-linux
          path: |
            desktop/dist/*.AppImage
            desktop/dist/*.deb
            desktop/dist/*.rpm
            desktop/dist/*.pacman
          if-no-files-found: error
          retention-days: 14
