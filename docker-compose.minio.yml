# The board's own MinIO, for STORAGE=s3 (README: "Storing files in MinIO"). Loopback only: the board
# streams files to the browser itself, so the bucket never needs to be reachable from elsewhere.
# The board creates its bucket on first use.
#
#   docker compose -f docker-compose.minio.yml up -d
#   console: http://localhost:47121 (S3_ACCESS_KEY / S3_SECRET_KEY)
services:
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address :9001
    restart: unless-stopped
    ports:
      - '127.0.0.1:47120:9000'
      - '127.0.0.1:47121:9001'
    environment:
      - MINIO_ROOT_USER=${S3_ACCESS_KEY:-agent-board}
      - MINIO_ROOT_PASSWORD=${S3_SECRET_KEY:-agent-board-minio-secret}
    volumes:
      - minio_data:/data

volumes:
  minio_data:
